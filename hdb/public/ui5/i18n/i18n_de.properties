help=Hilfe
helpStartTitle=Erste Schritte
helpStartText=Mit der Menüschaltfläche oben links öffnen oder schließen Sie die Navigation. Die Sprache ändern Sie im Menü hinter Ihren Initialen oben rechts. Wählen Sie eine Tabelle, um ihre Zeilen zu sehen, und eine Zeile für ihre Details. Die Adresse jeder Tabelle und Zeile lässt sich teilen und öffnet nach der Anmeldung dieselbe Seite.
helpRowsTitle=Mit Zeilen arbeiten
helpRowsText=Über der Zeilenliste können Sie suchen, sortieren und Zeilen hinzufügen. Öffnen Sie eine Zeile, um sie zu bearbeiten oder zu löschen. Einzelne Zeilen lassen sich nur öffnen, wenn die Tabelle eine Spalte id hat, sonst sind ihre Zeilen schreibgeschützt. Beim Speichern geht jedes geänderte Feld einzeln an den Server, Änderungen an mehreren Feldern sind also nicht atomar.
helpRolesTitle=Rollen
helpRolesText=Betrachter können Tabellen und Statistik lesen. Bearbeiter können außerdem Zeilen hinzufügen, ändern und löschen. Administratoren können zusätzlich Backups verwalten und in der Admin-Konsole Tabellen und Benutzer anlegen. Rollen gelten für die ganze Datenbank.
helpBackupsTitle=Backups
helpBackupsText=Administratoren können Backups erstellen, herunterladen, hochladen und wiederherstellen und den Zeitplan festlegen. Ein Backup enthält alle Tabellen, aber keine Benutzer. Wiederherstellen ersetzt alle Tabellen, vorher wird der aktuelle Stand als Sicherheits-Backup gespeichert.
helpStatsTitle=Die Statistik lesen
helpStatsText=Jede Spalte hat einen komprimierten Main-Store und einen kleinen Delta-Store für neue Zeilen. Zeilen im Delta sind noch nicht in den Main-Store übernommen. Gelöschte Zeilen sind für Abfragen unsichtbar und werden beim nächsten Merge entfernt. Distinct ist die Anzahl verschiedener Werte, und weniger Werte lassen sich besser komprimieren. Die Code-Größe umfasst die Codes des Main-Stores ohne Dictionaries und ist also nicht der gesamte Speicher der Tabelle.
helpSessionTitle=Ihre Sitzung
helpSessionText=Eine Sitzung dauert höchstens 12 Stunden und endet, wenn Sie diesen Browser-Tab schließen oder sich abmelden. Sperrt eine offene Transaktion die Datenbank, schlagen Anfragen fehl, bis sie endet. Ohne Aktivität wird sie nach 30 Sekunden zurückgerollt.
helpAdminLink=Mehr Hilfe in der Admin-Konsole, auch zu SQL und Datentypen
