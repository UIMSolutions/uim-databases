help=Help
helpStartTitle=Getting around
helpStartText=Use the menu button at the top left to open or collapse the navigation. To change the language, open the menu behind your initials at the top right. Select a table to see its rows, and select a row to see its details. You can share the address of any table or row, and it opens the same page after sign-in.
helpRowsTitle=Working with rows
helpRowsText=Search, sort and add rows above the row list. Open a row to edit or delete it. A table needs a column named id for single rows to open, otherwise its rows are read-only. Saving sends each changed field separately, so a change to several fields is not all-or-nothing.
helpRolesTitle=Roles
helpRolesText=Viewers can read tables and statistics. Editors can also add, change and delete rows. Admins can also manage backups, and create tables and users in the admin console. Roles apply to the whole database.
helpBackupsTitle=Backups
helpBackupsText=Admins can create, download, upload and restore backups, and set the schedule. A backup contains all tables, but not users. Restoring replaces all tables, and a safety backup of the current state is saved first.
helpStatsTitle=Reading the statistics
helpStatsText=Each column has a compressed main store and a small delta store that takes new rows. Rows in delta aren't merged into the main store yet. Deleted rows are hidden from queries and removed at the next merge. Distinct is the number of different values, and fewer values compress better. Code size covers the main store's codes without dictionaries, so it isn't the table's total memory.
helpSessionTitle=Your session
helpSessionText=A session lasts up to 12 hours and ends when you close this browser tab or sign out. If the database is locked by an open transaction, requests fail until that transaction ends. It rolls back after 30 seconds without activity. To change your password, open the menu behind your initials. This signs you out everywhere else.
