helpTenantTitle=Tenants
helpTenantText=Each tenant has its own tables, users and backups, and nothing is shared between them. Enter your tenant when you sign in. Leave it empty for the default tenant. This app remembers the last tenant on this device. Your tenant is shown at the top, next to the app name.
